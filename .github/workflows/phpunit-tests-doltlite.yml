name: PHPUnit Tests (Doltlite)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Doltlite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doltlite build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev tcl-dev

      - name: Check out Doltlite
        uses: actions/checkout@v4
        with:
          repository: dolthub/doltlite
          path: doltlite-src

      - name: Patch Doltlite for mysql-on-sqlite compatibility
        # Four narrow, verifiable source-level patches applied before build:
        #
        # 1) src/build.c — neutralize the auto-conversion of composite/TEXT-PK
        #    tables to WITHOUT ROWID, since the driver currently relies on
        #    rowid tables for table rewrites, DML rewrites, triggers, and
        #    metadata reads.
        #
        # 2) src/prolly_btree.c — keep mergeScan aligned when committed
        #    tree rows are merged with transaction-local mutmap entries.
        #    Without this, INSERT+DELETE+UPDATE in one transaction trips
        #    "database disk image is malformed", and prefix scans can leak
        #    committed tree rows that do not satisfy the seek constraint.
        #
        # 3) src/doltlite_hashof.c — while canonicalizing sqlite_schema SQL,
        #    strip comments before collapsing whitespace. Without this, a
        #    rollback can rewrite CREATE statements containing "--" comments
        #    into malformed schema SQL.
        #
        # 4) src/prolly_btree.c — for BTREE_AUXDELETE, trust the cached seek
        #    key only when it still matches the current cursor row. Without
        #    this, deletes through non-key predicates can leave stale unique
        #    index entries visible inside the transaction.
        #
        # Doltlite upstream already includes the eqSeen preservation and
        # lossy-collation payload fixes this workflow previously patched in.
        # The verification step below keeps covering those behaviors.
        run: |
          BUILD=doltlite-src/src/build.c
          MOVETO=doltlite-src/src/prolly_btree.c
          HASHOF=doltlite-src/src/doltlite_hashof.c

          # --- Patch 1: disable WITHOUT ROWID auto-conversion ---
          patch -d doltlite-src -p1 --no-backup-if-mismatch \
            < .github/doltlite-patches/keep-driver-rowid-tables.patch

          # --- Patch 2: align mergeScan tree/mutmap iteration ---
          patch -d doltlite-src -p1 --no-backup-if-mismatch \
            < .github/doltlite-patches/mergeScan-check-tree-delete.patch

          # --- Patch 3: keep canonicalized schema SQL parseable ---
          patch -d doltlite-src -p1 --no-backup-if-mismatch \
            < .github/doltlite-patches/canonicalize-schema-sql-comments.patch

          # --- Patch 4: delete current auxiliary index keys ---
          patch -d doltlite-src -p1 --no-backup-if-mismatch \
            < .github/doltlite-patches/auxdelete-use-current-key.patch

          echo "--- Patched lines ---"
          grep -n 'keep mysql-on-sqlite tables as rowid tables\|logically-deleted tree row\|advanceTreePastMutEntry\|z\[1\]==\|cachedSeekKeyMatchesCurrent' "$BUILD" "$MOVETO" "$HASHOF"

      - name: Build Doltlite shared library
        run: |
          mkdir -p build
          cd build
          # Same feature set we enable for stock-SQLite runs. PHP's pdo_sqlite
          # pulls in sqlite3_column_table_name, which needs COLUMN_METADATA.
          CFLAGS="-DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_FTS5 -DSQLITE_USE_URI -DSQLITE_ENABLE_JSON1" \
            ../configure
          make -j"$(nproc)" doltlite-lib
          ls -la libdoltlite* sqlite3.h
        working-directory: doltlite-src

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          tools: phpunit-polyfills

      - name: Install Doltlite as the system libsqlite3
        # Replace the system libsqlite3 the dynamic linker resolves for
        # pdo_sqlite with the Doltlite build. This is more reliable than
        # LD_PRELOAD, which loses to pdo_sqlite's DT_NEEDED on libsqlite3.so.0.
        run: |
          SRC="${GITHUB_WORKSPACE}/doltlite-src/build/libdoltlite.so"
          test -f "$SRC"

          # Drop the build into /usr/local/lib and update the linker cache before
          # replacing the system libsqlite3 soname. Running ldconfig after the
          # replacement can restore Ubuntu's stock libsqlite3.so.0 symlink.
          sudo install -m 0755 "$SRC" /usr/local/lib/libdoltlite.so
          sudo ln -sf /usr/local/lib/libdoltlite.so /usr/local/lib/libdoltlite.so.0

          sudo ldconfig

          sudo ln -sf /usr/local/lib/libdoltlite.so /usr/local/lib/libsqlite3.so
          sudo ln -sf /usr/local/lib/libdoltlite.so /usr/local/lib/libsqlite3.so.0

          MULTIARCH_DIR="$(dirname "$(readlink -f /lib/x86_64-linux-gnu/libsqlite3.so.0)")"
          sudo rm -f "${MULTIARCH_DIR}/libsqlite3.so.0"
          sudo ln -s /usr/local/lib/libdoltlite.so "${MULTIARCH_DIR}/libsqlite3.so.0"

          echo "libsqlite3.so.0 target:"
          readlink -f /lib/x86_64-linux-gnu/libsqlite3.so.0

          echo "ldd pdo_sqlite:"
          ldd "$(php -r 'echo ini_get("extension_dir");')/pdo_sqlite.so"

      - name: Verify Doltlite is active and compatibility behavior is intact
        run: |
          VERSION=$(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT SQLITE_VERSION()")->fetch()[0];')
          ENGINE=$(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT doltlite_engine()")->fetch()[0];')
          echo "SQLITE_VERSION()  = ${VERSION}"
          echo "doltlite_engine() = ${ENGINE}"
          if [ "${ENGINE}" != "prolly" ]; then
            echo "::error::Doltlite is not active (expected doltlite_engine() = 'prolly', got '${ENGINE}')"
            exit 1
          fi
          # 1) build.c patch: composite-PK driver tables keep rowid accessible
          # instead of auto-converting to WITHOUT ROWID.
          STATS_ROWID=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE _wp_sqlite_mysql_information_schema_statistics (table_schema TEXT, table_name TEXT, index_name TEXT, seq_in_index INT, PRIMARY KEY (table_schema, table_name, index_name, seq_in_index)) STRICT");
            $db->exec("INSERT INTO _wp_sqlite_mysql_information_schema_statistics VALUES (\"s\", \"t\", \"i\", 1)");
            echo $db->query("SELECT rowid FROM _wp_sqlite_mysql_information_schema_statistics")->fetch()[0];
          ' 2>&1)
          echo "statistics metadata rowid = ${STATS_ROWID}"
          if ! [[ "${STATS_ROWID}" =~ ^[0-9]+$ ]]; then
            echo "::error::rowid-preservation patch did not take effect: ${STATS_ROWID}"
            exit 1
          fi
          ROWID=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE t (a INT, b INT, PRIMARY KEY(a, b))");
            $db->exec("INSERT INTO t VALUES (1, 2)");
            echo $db->query("SELECT rowid FROM t")->fetch()[0];
          ' 2>&1)
          echo "ordinary composite-PK rowid = ${ROWID}"
          if ! [[ "${ROWID}" =~ ^[0-9]+$ ]]; then
            echo "::error::ordinary composite-PK rowid patch did not take effect: ${ROWID}"
            exit 1
          fi
          # 2) Doltlite upstream behavior: two sequential DELETEs inside a
          # SAVEPOINT on a composite NOCASE PK no longer silently lose
          # the second DELETE.
          REMAINING=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE t (ts TEXT NOT NULL COLLATE NOCASE, tn TEXT NOT NULL COLLATE NOCASE, cn TEXT NOT NULL COLLATE NOCASE, PRIMARY KEY (ts, tn, cn))");
            $db->exec("INSERT INTO t VALUES (\"s\", \"t\", \"id\")");
            $db->exec("INSERT INTO t VALUES (\"s\", \"t\", \"alpha\")");
            $db->exec("INSERT INTO t VALUES (\"s\", \"t\", \"beta\")");
            $db->exec("SAVEPOINT sp");
            $db->exec("DELETE FROM t WHERE ts = \"s\" AND tn = \"t\" AND cn = \"alpha\"");
            $db->exec("DELETE FROM t WHERE ts = \"s\" AND tn = \"t\" AND cn = \"beta\"");
            $db->exec("RELEASE SAVEPOINT sp");
            $rows = $db->query("SELECT cn FROM t ORDER BY cn")->fetchAll(PDO::FETCH_COLUMN);
            echo implode(",", $rows);
          ' 2>&1)
          echo "post-SAVEPOINT remaining rows = ${REMAINING}"
          if [ "${REMAINING}" != "id" ]; then
            echo "::error::eqSeen behavior is still broken: expected only 'id', got '${REMAINING}'"
            exit 1
          fi
          # 3) mergeScan patch: UPDATE inside a transaction after an
          # INSERT + DELETE no longer trips "database disk image is
          # malformed".
          VAL=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE c (ka TEXT, kb TEXT, kc TEXT, v TEXT, PRIMARY KEY (ka, kb, kc))");
            $db->exec("INSERT INTO c VALUES (\"db\", \"t\", \"a\", \"\")");
            $db->exec("BEGIN IMMEDIATE");
            $db->exec("INSERT INTO c VALUES (\"db\", \"t\", \"b\", \"\")");
            $db->exec("DELETE FROM c WHERE ka = \"db\" AND kb = \"t\" AND kc = \"a\"");
            $db->exec("UPDATE c SET v = \"x\" WHERE ka = \"db\" AND kb = \"t\"");
            $db->exec("COMMIT");
            echo $db->query("SELECT v FROM c")->fetch()[0];
          ' 2>&1)
          echo "post-UPDATE value = ${VAL}"
          if [ "${VAL}" != "x" ]; then
            echo "::error::mergeScan patch did not take effect: expected 'x', got '${VAL}'"
            exit 1
          fi
          # 4) mergeScan patch: a mutmap-only row must not be followed
          # by a stale committed tree row that falls before the seek
          # prefix.
          MATCHED_TABLES=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE c (ts TEXT NOT NULL COLLATE NOCASE, tn TEXT NOT NULL COLLATE NOCASE, cn TEXT NOT NULL COLLATE NOCASE, ordinal INT NOT NULL, PRIMARY KEY (ts, tn, cn)) STRICT");
            $insert = $db->prepare("INSERT INTO c VALUES (?, ?, ?, ?)");
            $db->exec("BEGIN IMMEDIATE");
            $insert->execute(array("sqlite_database", "t1", "id", 1));
            $db->exec("COMMIT");
            $db->exec("BEGIN IMMEDIATE");
            $insert->execute(array("sqlite_database", "t2", "id", 1));
            $stmt = $db->prepare("SELECT tn FROM c WHERE ts = ? AND tn = ? ORDER BY ordinal");
            $stmt->execute(array("sqlite_database", "t2"));
            echo implode(",", $stmt->fetchAll(PDO::FETCH_COLUMN));
          ' 2>&1)
          echo "prefix-scan matched tables = ${MATCHED_TABLES}"
          if [ "${MATCHED_TABLES}" != "t2" ]; then
            echo "::error::mergeScan prefix scan is still broken: expected only 't2', got '${MATCHED_TABLES}'"
            exit 1
          fi
          # 5) schema SQL canonicalization patch: rollback after a
          # CHECK failure must not make schema SQL with comments
          # unparseable.
          SCHEMA_AFTER_ROLLBACK=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
            $db->exec("CREATE TABLE c (
              id INT CHECK (id > 0), -- inline comment
              name TEXT
            ) STRICT");
            try {
              $db->exec("BEGIN IMMEDIATE");
              $db->exec("INSERT INTO c VALUES (0, \"bad\")");
              $db->exec("COMMIT");
            } catch (Throwable $e) {
              $db->exec("ROLLBACK");
            }
            $db->query("SELECT * FROM c")->fetchAll(PDO::FETCH_ASSOC);
            echo "ok";
          ' 2>&1)
          echo "schema after CHECK rollback = ${SCHEMA_AFTER_ROLLBACK}"
          if [ "${SCHEMA_AFTER_ROLLBACK}" != "ok" ]; then
            echo "::error::schema canonicalization patch did not take effect: ${SCHEMA_AFTER_ROLLBACK}"
            exit 1
          fi
          # 6) auxiliary index delete patch: deleting through a non-key
          # predicate must remove the corresponding unique index entry.
          AUXDELETE_REUSE=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
            $db->exec("CREATE TABLE s (a TEXT COLLATE NOCASE, b TEXT COLLATE NOCASE, idx TEXT COLLATE NOCASE, seq INT, col TEXT COLLATE NOCASE, PRIMARY KEY (a, b, idx, seq), UNIQUE (a, b, idx, seq)) STRICT");
            $db->exec("INSERT INTO s VALUES (\"sqlite_database\", \"t\", \"u\", 1, \"b\")");
            $db->exec("INSERT INTO s VALUES (\"sqlite_database\", \"t\", \"u\", 2, \"c\")");
            $db->exec("BEGIN IMMEDIATE");
            $delete = $db->prepare("DELETE FROM s WHERE col = ?");
            $delete->execute(array("b"));
            $update = $db->prepare("UPDATE s SET seq = 1 WHERE col = ?");
            $update->execute(array("c"));
            $select = $db->prepare("SELECT seq FROM s WHERE col = ?");
            $select->execute(array("c"));
            echo $select->fetchColumn();
          ' 2>&1)
          echo "auxdelete key reuse = ${AUXDELETE_REUSE}"
          if [ "${AUXDELETE_REUSE}" != "1" ]; then
            echo "::error::auxiliary index delete patch did not take effect: ${AUXDELETE_REUSE}"
            exit 1
          fi
          # 7) Doltlite upstream behavior: a covering-index read on a
          # composite-PK rowid table with a NOCASE text column no
          # longer returns folded bytes.
          NAME=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE t (id INT, pkcol TEXT COLLATE NOCASE, extra TEXT, PRIMARY KEY (id, pkcol))");
            $db->exec("INSERT INTO t VALUES (1, \"Johnny\", \"x\")");
            echo $db->query("SELECT pkcol FROM t")->fetch()[0];
          ' 2>&1)
          echo "covering-index pkcol = ${NAME}"
          if [ "${NAME}" != "Johnny" ]; then
            echo "::error::lossy-collation behavior is still broken: expected 'Johnny', got '${NAME}'"
            exit 1
          fi

      - name: Install Composer dependencies (root)
        uses: ramsey/composer-install@v3
        with:
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install Composer dependencies (mysql-on-sqlite)
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Run PHPUnit tests against Doltlite
        run: php ./vendor/bin/phpunit -c ./phpunit.xml.dist
        working-directory: packages/mysql-on-sqlite
